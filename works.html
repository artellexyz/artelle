<body>

<header class="site-head">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="Artelle — home">
      <svg viewBox="0 0 120 120" aria-hidden="true"><line x1="22" y1="84" x2="98" y2="84" stroke="#1C1712" stroke-width="6" stroke-linecap="round"/><circle cx="76" cy="70" r="11" fill="#1C1712"/></svg>
      <span class="wordmark">artelle</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="works.html" aria-current="page">Works</a>
      <a href="editions.html">Editions</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>

</header>

<main>
  <section class="section" style="padding-top:20px">
    <div class="wrap">
      <p class="eyebrow">The catalogue</p>
      <div class="section-head">
        <h1 style="font-size:clamp(2.4rem,4.5vw,3.6rem)">Works</h1>
        <div class="filters" role="group" aria-label="Filter works">
          <button class="chip" data-filter="all" aria-pressed="true">All</button>
          <button class="chip" data-filter="original" aria-pressed="false">Originals</button>
          <button class="chip" data-filter="print" aria-pressed="false">Prints</button>
        </div>
      </div>

      <div class="works">

        <a class="work reveal" href="assets/art/work-01.jpg" data-cats="original print"
           data-title="Untitled (Mosque)" data-meta="Colored pencil &amp; watercolor on paper · Original &amp; prints — enquire">
          <figure>
            <div class="plate"><img src="assets/art/work-01.jpg" alt="Colored pencil and watercolor study of a grand mosque — red sandstone walls, white marble domes and minarets under a pale sky, blossoming branches in the foreground"></div>
            <figcaption class="cap">
              <div>
                <div class="title">Untitled (Mosque)</div>
                <div class="meta">Colored pencil &amp; watercolor on paper</div>
              </div>
              <div class="price">Enquire</div>
            </figcaption>
          </figure>
        </a>

      </div>
      <p style="margin-top:-18px;font-size:.9rem;color:var(--ink-2)">New works are added as they leave the studio and are photographed.</p>
    </div>
  </section>
</main>

<footer class="site-foot">
  <div class="wrap">
    <a class="foot-brand" href="index.html">
      <svg viewBox="0 0 120 120" aria-hidden="true"><line x1="22" y1="84" x2="98" y2="84" stroke="#6B6353" stroke-width="6" stroke-linecap="round"/><circle cx="76" cy="70" r="11" fill="#6B6353"/></svg>
      <span>artelle</span>
    </a>
    <p>Original works · Archival prints · Digital editions</p>
    <p><a href="mailto:hello@artelle.xyz">hello@artelle.xyz</a>&ensp;·&ensp;&copy; <span id="yr">2026</span> Artelle</p>
  </div>
</footer>

<div class="lb" id="lightbox" role="dialog" aria-modal="true" aria-label="Artwork viewer">
  <button class="lb-btn lb-x" aria-label="Close">&times;</button>
  <button class="lb-btn lb-prev" aria-label="Previous work">&lsaquo;</button>
  <button class="lb-btn lb-next" aria-label="Next work">&rsaquo;</button>
  <figure class="lb-figure">
    <div class="lb-frame"></div>
    <figcaption class="lb-cap">
      <span class="lb-title"></span>
      <span class="lb-meta"></span>
    </figcaption>
  </figure>
</div>

<script src="assets/js/site.js"></script>
